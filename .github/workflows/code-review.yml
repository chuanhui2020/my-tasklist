name: Code Review

on:
  push:
    branches-ignore:
      - master
      - main

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: code-review-${{ github.ref }}
  cancel-in-progress: true

env:
  AI_BASE_URL: https://api.ch-tools.org
  AI_MODEL: gpt-6.2-astra

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Lint frontend
        run: cd frontend && npm ci && npm run lint

      - name: Lint backend
        run: cd backend && npm ci && npm run lint

  build-check:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build frontend
        run: cd frontend && npm ci && npm run build

      - name: Typecheck backend
        run: cd backend && npm ci && npm run typecheck

  code-review:
    needs: build-check
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Codex CLI
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          # 锁定版本：避免上游 breaking release 静默打断 review（0.171.0 = 2026-11-20 最新稳定版）
          npm install -g @openai/codex@0.171.0
          codex --version

      - name: Find or create PR
        id: pr
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"

          PR_NUMBER=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')

          if [ -z "$PR_NUMBER" ]; then
            PR_URL=$(gh pr create --head "$BRANCH" --base master --title "Auto PR: $BRANCH" --body "Auto-created by CI")
            PR_NUMBER=$(echo "$PR_URL" | grep -oE '[0-9]+$')
          fi

          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Run Codex review
        id: codex
        timeout-minutes: 20  # xhigh 档审查更慢，与下方 timeout 1080 配套
        env:
          OPENAI_API_KEY: ${{ secrets.AI_API_KEY }}
        run: |
          mkdir -p ~/.codex
          cat > ~/.codex/config.toml << 'TOML'
          model = "${{ env.AI_MODEL }}"
          model_provider = "proxy"
          # 审查只需读代码 + git diff：沙箱设为 read-only，模型生成的命令不能写盘/联网，
          # 避免仓库内容做提示注入后窃取 GH_TOKEN / OPENAI_API_KEY。
          # （沙箱只约束模型生成的命令，codex 自身访问模型 API 不受影响）
          # 键名必须是 sandbox_mode / model_reasoning_effort：旧写法 sandbox / reasoning_effort
          # 是无效键，会被静默忽略（high 档从未生效）。下方 exec 加了 --strict-config，写错键会直接报错
          sandbox_mode = "read-only"
          # 非交互 CI：审批一律拒绝，避免模型请求提权时卡住
          approval_policy = "never"
          # xhigh：0.171.0 已验证可用（--strict-config 加载通过，启动头显示 reasoning effort: xhigh）
          model_reasoning_effort = "xhigh"

          [model_providers.proxy]
          name = "Custom Proxy"
          base_url = "${{ env.AI_BASE_URL }}/v1"
          env_key = "OPENAI_API_KEY"
          supports_websockets = false
          TOML

          PROMPT='You are a code reviewer. Run git diff origin/master...HEAD to see changes. READ-ONLY, do NOT modify files.
          Context: Personal project on Cloudflare Workers.
          Review standards:
          - Critical: real bugs causing runtime errors or data loss
          - Warning: performance or quality concerns
          - Suggestion: improvements (optional)
          Output your review in Chinese, concise. Use this EXACT format:
          ===REVIEW_START===
          **Summary:** 一句话总结变更
          **Critical:** (无则写"无")
          **Warnings:** (无则写"无")
          **Suggestions:** (可选，最多3条，无则省略此段)
          VERDICT: PASS
          ===REVIEW_END===
          Use VERDICT: FAIL only for confirmed runtime errors or data loss bugs.'

          # 0.147.0 已移除 exec 的 --full-auto，用显式 --sandbox 替代（与 config.toml 保持一致）
          # -o 只落模型最终回复：raw 输出会回显整段 PROMPT（含 REVIEW 标记和 VERDICT 模板），
          #   从 raw 里解析会在模型失败时把模板当成 review。raw 只用于日志排障。
          # timeout 1080 < 步骤 timeout-minutes(20)：网关不通时 codex 会无限重连，
          #   必须让它先退出，后续评论/打标签/Fail on empty review 才能执行
          # </dev/null：新版 exec 在 stdin 非 TTY 时会读 stdin 拼进 prompt，显式关掉
          rm -f /tmp/codex_last.txt
          timeout 1080 codex exec --strict-config --sandbox read-only -o /tmp/codex_last.txt "$PROMPT" \
            < /dev/null > /tmp/codex_raw.txt 2>&1 || true
          touch /tmp/codex_last.txt

          # 把原始输出打进 job log：失败时 codex_raw.txt 不落盘也不上传，报错会彻底丢失
          echo "===== codex raw output (tail 4000B) ====="
          tail -c 4000 /tmp/codex_raw.txt || echo "(codex_raw.txt 为空或不存在)"
          echo "===== end codex raw output ====="

          # 只从模型最终回复（codex_last.txt）里解析，取最后一个标记块
          if grep -q "===REVIEW_START===" /tmp/codex_last.txt; then
            awk '/===REVIEW_START===/{buf=""; capture=1; next} /===REVIEW_END===/{capture=0} capture{buf=buf $0 "\n"} END{printf "%s", buf}' /tmp/codex_last.txt > /tmp/codex_output.txt
          elif grep -q "VERDICT" /tmp/codex_last.txt; then
            tail -20 /tmp/codex_last.txt > /tmp/codex_output.txt
          else
            echo "Review 未能生成有效输出" > /tmp/codex_output.txt
            # 标记失败，交给最后一步 fail job；不在这里 exit，否则评论/标签都不会执行
            echo "review_failed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate changelog
        id: changelog
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
        run: |
          COMMITS=$(git log origin/master..HEAD --pretty=format:"%h %s")

          # GPT-6.2 是推理模型：不接受 temperature；输出上限用 max_completion_tokens（含推理 token）
          PAYLOAD=$(jq -n \
            --arg model "$AI_MODEL" \
            --arg content "Based on these git commit messages, generate a changelog in Chinese using Keep a Changelog format (Added/Fixed/Changed sections). Only include relevant sections.\n\nCommit messages:\n$COMMITS\n\nReturn ONLY the changelog content in Markdown." \
            '{model: $model, messages: [{role: "user", content: $content}], reasoning_effort: "xhigh", max_completion_tokens: 8000}')

          CHANGELOG=$(curl -s "${AI_BASE_URL}/v1/chat/completions" \
            -H "Authorization: Bearer $AI_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" | jq -r '.choices[0].message.content // empty') || true

          if [ -z "$CHANGELOG" ]; then
            CHANGELOG=$(git log origin/master..HEAD --pretty=format:"- %h %s")
          fi

          {
            echo 'content<<CHANGELOG_EOF'
            echo "$CHANGELOG"
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Post review comment
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          CHANGELOG: ${{ steps.changelog.outputs.content }}
        run: |
          CODEX_OUTPUT=$(cat /tmp/codex_output.txt)

          cat > /tmp/comment.md << COMMENT_EOF
          ## Code Review

          ${CODEX_OUTPUT}

          ---

          **Changelog:** ${CHANGELOG}
          COMMENT_EOF

          gh issue comment "$PR_NUMBER" --body-file /tmp/comment.md

      - name: Auto-merge or label
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          # 只看模型最终回复：raw 里有 PROMPT 回显的 VERDICT 模板，不能参与判定。
          # 且只认「最后一个完整审查块」（START…END 都在）里唯一的判定行：
          # 回复被截断缺结束标记、或块内出现多个判定 → 一律不合并，按 needs-fix 处理。
          # 判定必须独占一行（整行精确匹配），正文里顺带引用的「VERDICT: PASS」不算
          BLOCK=$(awk '/===REVIEW_START===/{buf=""; done=""; capture=1; next} /===REVIEW_END===/{if(capture) done=buf; capture=0; next} capture{buf=buf $0 "\n"} END{printf "%s", done}' /tmp/codex_last.txt 2>/dev/null || true)
          VERDICTS=$(printf '%s' "$BLOCK" | tr -d '\r' | grep -xE '[[:space:]]*VERDICT: (PASS|FAIL)[[:space:]]*' | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//' || true)
          VERDICT=""
          if [ "$(printf '%s' "$VERDICTS" | grep -c '^VERDICT')" = "1" ]; then VERDICT="$VERDICTS"; fi
          echo "verdict: '${VERDICT:-<none>}'"

          if [ "$VERDICT" = "VERDICT: PASS" ]; then
            # 清掉此前轮次留下的 needs-fix，避免已合并的 PR 挂着过期标签
            gh issue edit "$PR_NUMBER" --remove-label "needs-fix" 2>/dev/null || true
            gh pr merge "$PR_NUMBER" --merge --delete-branch=false || \
              gh issue comment "$PR_NUMBER" --body "⚠️ 自动合并失败，请手动处理。"
          else
            gh label create "needs-fix" --color "d73a4a" --description "Review failed" 2>/dev/null || true
            gh issue edit "$PR_NUMBER" --add-label "needs-fix"
          fi

      # review 完全没产出（CLI 报错、模型不可用等）属于流程故障，必须让 job 变红。
      # 此前这种情况 job 仍是绿灯，只在 PR 上留个 needs-fix，导致 codex --full-auto
      # 被上游移除后 review 静默失效了很久都没人察觉。
      - name: Fail on empty review
        if: steps.codex.outputs.review_failed == 'true'
        run: |
          echo "::error::Codex review 未产出有效输出，见 'Run Codex review' 步骤的 raw output"
          exit 1
